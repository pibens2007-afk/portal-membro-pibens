<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta id="themeColor" name="theme-color" content="#FAFAFA">
<meta name="description" content="Portal do Membro — PIBENS">
<title>Portal do Membro — PIBENS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="telaLogin" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo-512.png" alt="PIBENS">
    </div>
    <h1>Portal do Membro</h1>
    <p>PIBENS</p>
    <p class="login-nome-igreja">Primeira Igreja Batista em Encarnação de Salinas</p>
    <input 
      type="text" 
      id="email" 
      placeholder="Digite seu CPF" 
      autocomplete="username"
      inputmode="numeric"
      maxlength="14"
      oninput="formatarCPF(this)">
    <input 
      type="password" 
      id="senha" 
      placeholder="Sua senha" 
      autocomplete="current-password">
    <button id="btnEntrar">Entrar</button>
    <div class="erro" id="erroLogin"></div>
    <p class="login-dica">Esqueceu a senha? Fale com um líder.</p>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="telaApp" class="hidden">

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">
      <img class="header-logo" src="logo-192.png" alt="">
      <div class="header-text">
        <h1>PIBENS</h1>
        <span class="header-sub">Primeira Igreja Batista em Encarnação de Salinas</span>
      </div>
    </div>
    <span class="header-page" id="titulo">Início</span>
    <button class="avatar" id="avatar" type="button" aria-label="Abrir perfil">?</button>
  </header>

  <!-- CONTEÚDO -->
  <main class="content" id="conteudo" aria-live="polite"></main>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <button class="nav-item active" data-page="inicio"><span class="icon">🏠</span>Início</button>
    <button class="nav-item" data-page="agenda"><span class="icon">📅</span>Agenda</button>
    <button class="nav-item" data-page="oracao"><span class="icon">🙏</span>Oração</button>
    <button class="nav-item" data-page="devocional"><span class="icon">✨</span>Devocional</button>
    <button class="nav-item" data-page="perfil"><span class="icon">👤</span>Perfil</button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>

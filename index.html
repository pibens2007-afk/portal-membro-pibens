<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B5CF6">
<meta name="description" content="Portal do Membro — PIBENS, Primeira Igreja Batista em Encarnação de Salinas">
<title>Portal do Membro — PIBENS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://pibens2007-afk.github.io/pibens-adm/logo-192.png">
<link rel="apple-touch-icon" href="https://pibens2007-afk.github.io/pibens-adm/logo-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ TELA DE LOGIN ═══ -->
<div id="telaLogin" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <img src="https://pibens2007-afk.github.io/pibens-adm/logo-192.png" alt="PIBENS">
    </div>
    <h1>Portal do Membro</h1>
    <p>PIBENS</p>
    <p class="login-nome-igreja">Primeira Igreja Batista em Encarnação de Salinas</p>
    <input 
      type="text" 
      id="email" 
      placeholder="CPF ou e-mail" 
      autocomplete="username"
      inputmode="text"
      autocapitalize="none">
    <input 
      type="password" 
      id="senha" 
      placeholder="Sua senha" 
      autocomplete="current-password">
    <button id="btnEntrar">Entrar</button>
    <div class="erro" id="erroLogin"></div>
  </div>
</div>

<!-- ═══ TELA DO APP ═══ -->
<div id="telaApp" class="hidden">
  <div class="header">
    <div class="header-brand">
      <img src="https://pibens2007-afk.github.io/pibens-adm/logo-192.png" alt="PIBENS" class="header-logo">
      <div class="header-text">
        <h2 id="titulo">Início</h2>
        <span class="header-sub">PIBENS — Encarnação de Salinas</span>
      </div>
    </div>
    <div class="avatar" id="avatar">?</div>
  </div>
  <div class="content" id="conteudo"></div>
  <nav class="bottom-nav nav-7">
    <button class="nav-item active" data-page="inicio"><span class="icon">🏠</span>Início</button>
    <button class="nav-item" data-page="agenda"><span class="icon">📅</span>Agenda</button>
    <button class="nav-item" data-page="escalas"><span class="icon">📋</span>Escalas</button>
    <button class="nav-item" data-page="mural"><span class="icon">📢</span>Mural</button>
    <button class="nav-item" data-page="oracao"><span class="icon">🙏</span>Oração</button>
    <button class="nav-item" data-page="contribuir"><span class="icon">💰</span>Contribuir</button>
    <button class="nav-item" data-page="perfil"><span class="icon">👤</span>Perfil</button>
  </nav>
</div>

<script src="app.js"></script>
</body>
</html>
